[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valuableHelper"
version = "1.0.0"
description = "A private Telegram bot for personal assistance and automation"
readme = "README.md"
requires-python = ">=3.11"

keywords = ["telegram", "bot", "assistant", "automation", "private", "rag", "agent"]

dependencies = [
    # Core Bot
    "python-telegram-bot==20.7",
    "python-dotenv",
    "rich>=1.0.0",
    "questionary",
    "psutil",

    # AI Providers
    "openai>=1.61.0",
    "anthropic>=0.45.0",
    "google-genai>=1.2.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2",
    "google-generativeai",
    
    # RAG & Vector Store
    "chromadb==0.5.0",
    "numpy<2.0",
    "sentence-transformers>=2.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # API & Web
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.25.2",
    "python-multipart>=0.0.7",  

    # Tools
    "duckduckgo-search",
    "pypdf",

    #sqlite
    "aiosqlite",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
